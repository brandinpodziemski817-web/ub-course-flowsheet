<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程流程图｜生物医学工程</title>
  <meta name="description" content="可交互的生物医学工程八学期课程流程图，展示先修、共修与后续课程关系。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%230b3347'/%3E%3Cpath d='M13 32h12l5-13 8 28 5-15h8' fill='none' stroke='%236fe0d4' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#13262f;--muted:#60747d;--paper:#f4f7f7;--card:#fff;--line:#dbe4e6;--brand:#0b5269;--brand-2:#0a3143;--accent:#e3ab3b;--pre-chain:#b9dfb6;--pre:#2d7f3a;--co-chain:#d8ccf3;--co:#7650c7;--post-co:#087f9f;--post:#82d1ef;--selected:#0c3045;--shadow:0 12px 34px rgba(16,48,63,.1)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif} button,select{font:inherit}
    .topbar{background:var(--brand-2);color:#fff;padding:18px 24px;border-bottom:4px solid var(--accent)}
    .topbar-inner{max-width:1600px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border:1px solid #4b7383;border-radius:10px;display:grid;place-items:center;color:#70e0d4;font-weight:800}.brand h1{font-size:1.18rem;margin:0}.brand p{font-size:.82rem;margin:2px 0 0;color:#bdd0d8}.status{font-size:.78rem;color:#d7e4e8;border:1px solid #507484;border-radius:99px;padding:6px 10px}
    main{max-width:1600px;margin:0 auto;padding:22px 24px 44px}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:0 3px 12px rgba(20,55,70,.05)}
    label{display:grid;gap:5px;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}select{min-width:210px;color:var(--ink);background:#fff;border:1px solid #bac9cd;border-radius:8px;padding:9px 34px 9px 11px}.summary{margin-left:auto;text-align:right}.summary strong{display:block;font-size:1.25rem}.summary span{font-size:.78rem;color:var(--muted)}
    .tabs{display:flex;gap:5px;margin:18px 0 12px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;font-weight:700}.tab.active{color:var(--brand);border-color:var(--accent)}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}.sheet-panel,.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.sheet-panel{overflow:hidden}.sheet-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.sheet-head h2{font-size:1rem;margin:0}.sheet-head p{font-size:.82rem;color:var(--muted);margin:3px 0 0}.reset{border:1px solid #b8c8cd;border-radius:8px;background:#fff;padding:7px 10px;cursor:pointer;color:var(--brand);font-weight:700}.reset:hover{background:#eef5f6}
    .scroller{overflow-x:auto;padding:16px}.years,.semesters,.course-grid,.hours{min-width:1120px;display:grid;grid-template-columns:repeat(8,minmax(124px,1fr));gap:7px}.years{margin-bottom:3px}.year{grid-column:span 2;text-align:center;background:#eaf0f2;color:var(--brand-2);padding:7px;border-radius:6px 6px 0 0;font-weight:800}.semesters{margin-bottom:8px}.semester{text-align:center;color:var(--muted);font-size:.78rem;font-weight:750;text-transform:uppercase}.course-grid{align-items:start}.term{display:grid;gap:7px;align-content:start}.course{min-height:72px;border:1px solid #cbd7da;background:#f9fbfb;border-radius:8px;padding:9px 9px 8px;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s,color .12s;border-left:4px solid #9db0b7;color:var(--ink)}.course:hover,.course:focus-visible{transform:translateY(-1px);box-shadow:0 7px 16px rgba(17,52,68,.13);outline:0}.course .code{display:block;font-weight:850;font-size:.9rem}.course .title{display:block;font-size:.74rem;line-height:1.25;margin-top:3px}.course .credits{display:block;color:var(--muted);font-size:.68rem;margin-top:5px}.course.selected{background:var(--selected);border-color:var(--selected);color:#fff}.course.selected .credits,.course.direct-pre .credits,.course.coreq .credits,.course.post-coreq .credits{color:rgba(255,255,255,.78)}.course.pre-chain{background:var(--pre-chain);border-color:#81bb7d}.course.direct-pre{background:var(--pre);border-color:var(--pre);color:#fff}.course.coreq-chain{background:var(--co-chain);border-color:#b09bdd}.course.coreq{background:var(--co);border-color:var(--co);color:#fff}.course.post-coreq{background:var(--post-co);border-color:var(--post-co);color:#fff}.course.post-chain{background:var(--post);border-color:#4db7df}.course.muted{opacity:.36;filter:saturate(.55)}
    .hours{margin-top:10px}.hour{text-align:center;border-top:2px solid var(--accent);padding-top:7px;font-weight:850;font-size:.8rem}.detail{position:sticky;top:16px;overflow:hidden}.detail-accent{height:5px;background:var(--accent)}.detail-body{padding:18px}.eyebrow{color:var(--brand);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:850}.detail h3{font-size:1.35rem;line-height:1.15;margin:7px 0 4px}.detail .course-name{color:var(--muted);margin:0 0 17px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:17px}.meta div{background:#eef3f4;border-radius:8px;padding:9px}.meta small{display:block;color:var(--muted)}.detail h4{font-size:.82rem;margin:16px 0 6px}.detail p,.relation-list{font-size:.82rem;color:#435b65}.relation-list{margin:0;padding-left:18px}.hint{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;font-size:.76rem;color:var(--muted)}
    .legend{display:flex;flex-wrap:wrap;gap:8px 15px;margin-top:14px;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:12px}.legend span{display:flex;align-items:center;gap:7px;font-size:.76rem;color:#465c65}.swatch{width:18px;height:13px;border:1px solid rgba(0,0,0,.16);border-radius:3px}.notes{margin-top:14px;background:#eaf1f2;border-left:4px solid var(--brand);padding:12px 15px;color:#465c65;font-size:.78rem}.empty{padding:60px 20px;text-align:center;color:var(--muted)}
    @media(max-width:1350px){.workspace{grid-template-columns:1fr}.detail{position:static}}
    @media(max-width:980px){.summary{width:100%;margin:0;text-align:left}.topbar-inner{align-items:flex-start}.status{display:none}}
    @media(max-width:620px){main{padding:14px 10px 32px}.topbar{padding:14px 12px}.brand p{display:none}.controls{align-items:stretch}label,select{width:100%}.tabs{overflow-x:auto}.tab{white-space:nowrap;padding-inline:10px}.sheet-head{align-items:flex-start}.sheet-head p{max-width:230px}.legend{display:grid;grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand"><div class="mark">BE</div><div><h1>工程课程流程图</h1><p>课程依赖关系与八学期学习路径</p></div></div><div class="status">交互演示 · 非官方选课依据</div></div></header>
  <main>
    <section class="controls" aria-label="培养方案筛选">
      <label>专业计划<select id="plan"><option value="BE">Biomedical Engineering BS</option></select></label>
      <label>生效学年<select id="year"><option value="2026">AY 2024–25 至 AY 2026–27</option></select></label>
      <div class="summary"><strong>128 学分</strong><span>标准八学期建议安排</span></div>
    </section>
    <nav class="tabs" aria-label="学生类型"><button class="tab active" data-view="first">新生路径</button><button class="tab" data-view="transfer">转学生路径</button><button class="tab" data-view="seamless">衔接转学</button></nav>
    <div class="workspace">
      <section class="sheet-panel"><div class="sheet-head"><div><h2 id="view-title">Biomedical Engineering · 新生流程图</h2><p>悬停预览关系，点击可固定选中；再次点击空白处取消。</p></div><button class="reset" id="reset">清除高亮</button></div><div class="scroller" id="sheet"></div></section>
      <aside class="detail" aria-live="polite"><div class="detail-accent"></div><div class="detail-body" id="detail"></div></aside>
    </div>
    <div class="legend" aria-label="颜色图例"><span><i class="swatch" style="background:var(--selected)"></i>当前课程</span><span><i class="swatch" style="background:var(--pre-chain)"></i>完整先修链</span><span><i class="swatch" style="background:var(--pre)"></i>直接先修</span><span><i class="swatch" style="background:var(--co-chain)"></i>共修关系链</span><span><i class="swatch" style="background:var(--co)"></i>直接共修</span><span><i class="swatch" style="background:var(--post-co)"></i>后置共修</span><span><i class="swatch" style="background:var(--post)"></i>后续课程链</span></div>
    <div class="notes">本页面是对课程流程图交互逻辑的独立复现。课程安排以公开培养方案为样例；实际选课、课程替代和毕业审核应以学校目录及学业导师意见为准。</div>
  </main>
  <script>
    const C=(id,title,credits,term,pre=[],co=[],desc='')=>({id,title,credits,term,pre,co,desc});
    const courses=[
      C('MTH 141','微积分 I',4,1,[],[],'工程数学基础，涵盖微分、积分及其应用。'),C('CHE 127','工程化学实验 I',.5,1,[],['CHE 107']),C('CHE 107','工程普通化学 I',3.5,1),C('EAS 199','大学研讨课',3,1),C('ENG 105','写作与修辞',4,1),C('PATH 1','主题或全球路径课程',3,1),
      C('MTH 142','微积分 II',4,2,['MTH 141']),C('CHE 108','工程普通化学 II',3.5,2,['CHE 107'],['CHE 128']),C('CHE 128','工程化学实验 II',.5,2,[],['CHE 108']),C('PHY 107','普通物理 I',4,2,[],['MTH 141']),C('BE 101','生物医学工程研讨课',1,2),C('PATH 2','主题或全球路径课程',3,2),
      C('MTH 241','微积分 III',4,3,['MTH 142']),C('PHY 108','普通物理 II',4,3,['PHY 107']),C('PHY 158','普通物理实验 II',1,3,['PHY 107'],['PHY 108']),C('BE 201','生物医学工程原理',3,3,['PHY 107']),C('EAS 200','非电类电气工程概念',3,3,['MTH 141']),
      C('MTH 306','微分方程',4,4,['MTH 142']),C('EAS 230','工程计算',3,4,['MTH 141']),C('BE 202','医学与工程生物学',3,4,['CHE 108','CHE 128']),C('EAS 207','静力学',3,4,['PHY 107','MTH 142'],['MTH 241']),C('EAS 360','STEM 沟通',3,4,['ENG 105']),
      C('BE 311','细胞与分子实验',3,5,['CHE 108'],['BE 201']),C('BE 305','生物材料与力学',3,5,['EAS 207'],['BE 201']),C('BE 307','生物医学电路与信号',3,5,['EAS 200','EAS 230'],['BE 201']),C('BE 309','生物医学工程化学 I',3,5,['CHE 108','CHE 128']),C('EAS 305','应用概率与统计',4,5,['MTH 142']),
      C('BE 312','生物信号实验',3,6,['EAS 305'],['BE 202']),C('BE 304','医学成像原理',3,6,['MTH 142'],['BE 202']),C('BE 308','生物流体力学',3,6,['MTH 241','MTH 306'],['EAS 230']),C('BE 310','生物医学工程化学 II',3,6,['BE 309'],['BE 202']),C('PATH 3','主题或全球路径课程',3,6),
      C('BE 403','生物医学仪器',3,7,['BE 307']),C('BE 405','生物医学传递过程',4,7,['BE 308']),C('BE 493','生物医学工程研究与设计',3,7,['BE 201','BE 311','BE 312']),C('BE TE 1','生物医学工程技术选修 I',3,7),C('BE TE 2','生物医学工程技术选修 II',3,7),
      C('BE 494','毕业设计项目',3,8,['BE 493']),C('BE 406','生物系统工程',3,8,['EAS 230','MTH 306']),C('BE 436','人体运动生物力学',3,8,['EAS 207']),C('TECH ELEC','技术选修课',3,8),C('PATH 4','主题或全球路径课程',3,8),C('UBC 399','UB 综合教育顶点课程',1,8,['EAS 199'])
    ];
    const views={first:{title:'Biomedical Engineering · 新生流程图',terms:[1,2,3,4,5,6,7,8],totals:[18,16,15,16,16,15,16,16]},transfer:{title:'Biomedical Engineering · 转学生流程图',terms:[1,2,3,4,5,6,7,8],totals:[18,15,15,16,17,18,16,13]},seamless:{title:'Biomedical Engineering · 衔接转学流程图',terms:[5,6,7,8],totals:[16,15,16,16]}};
    const byId=new Map(courses.map(c=>[c.id,c])); let pinned=null,hovered=null,currentView='first';
    const descendants=id=>{const out=new Set(),q=[id];while(q.length){const x=q.shift();courses.filter(c=>c.pre.includes(x)).forEach(c=>{if(!out.has(c.id)){out.add(c.id);q.push(c.id)}})}return out};
    const ancestors=id=>{const out=new Set(),q=[id];while(q.length){const c=byId.get(q.shift());if(!c)continue;c.pre.forEach(x=>{if(!out.has(x)){out.add(x);q.push(x)}})}return out};
    function classes(id,selected){if(!selected)return'';if(id===selected)return'selected';const s=byId.get(selected),direct=new Set(s?.pre||[]),up=ancestors(selected),co=new Set(s?.co||[]),coAnc=new Set([...co].flatMap(x=>[...ancestors(x)])),postCo=new Set(courses.filter(c=>c.co.includes(selected)).map(c=>c.id)),post=descendants(selected);if(direct.has(id))return'direct-pre';if(up.has(id))return'pre-chain';if(co.has(id))return'coreq';if(coAnc.has(id))return'coreq-chain';if(postCo.has(id))return'post-coreq';if(post.has(id))return'post-chain';return'muted'}
    function renderSheet(selected=pinned){const v=views[currentView],terms=v.terms,years=currentView==='seamless'?['Third Year','Fourth Year']:['First Year','Second Year','Third Year','Fourth Year'];const shown=courses.filter(c=>terms.includes(c.term));let html=`<div class="years">${years.map(y=>`<div class="year">${y}</div>`).join('')}</div><div class="semesters">${terms.map((_,i)=>`<div class="semester">${i%2?'Spring':'Fall'}</div>`).join('')}</div><div class="course-grid">${terms.map(t=>`<div class="term">${shown.filter(c=>c.term===t).map(c=>`<button class="course ${classes(c.id,selected)}" data-id="${c.id}" aria-label="${c.id} ${c.title}"><span class="code">${c.id}</span><span class="title">${c.title}</span><span class="credits">${c.credits} 学分</span></button>`).join('')}</div>`).join('')}</div><div class="hours">${v.totals.map(x=>`<div class="hour">${x} 学分</div>`).join('')}</div>`;document.querySelector('#sheet').innerHTML=html;bindCourses()}
    function relationNames(ids){return ids.length?ids.map(id=>`${id} ${byId.get(id)?.title||''}`):['无']}
    function renderDetail(id){const c=byId.get(id);if(!c){document.querySelector('#detail').innerHTML=`<div class="eyebrow">课程关系说明</div><h3>选择一门课程</h3><p class="course-name">查看它的先修、共修与后续课程链</p><p>在左侧流程图中悬停课程可临时预览，点击课程可固定高亮。</p><div class="hint">绿色表示上游先修关系，紫色表示同期关系，蓝色表示下游后续关系。</div>`;return}const post=[...descendants(id)],postCo=courses.filter(x=>x.co.includes(id)).map(x=>x.id);document.querySelector('#detail').innerHTML=`<div class="eyebrow">课程详情</div><h3>${c.id}</h3><p class="course-name">${c.title}</p><div class="meta"><div><small>建议学期</small>第 ${c.term} 学期</div><div><small>课程学分</small>${c.credits} 学分</div></div><p>${c.desc||'培养方案中的专业或通识课程。请以最新课程目录为准。'}</p><h4>直接先修</h4><ul class="relation-list">${relationNames(c.pre).map(x=>`<li>${x}</li>`).join('')}</ul><h4>直接共修</h4><ul class="relation-list">${relationNames(c.co).map(x=>`<li>${x}</li>`).join('')}</ul><h4>依赖它的后续课程</h4><ul class="relation-list">${relationNames([...new Set([...postCo,...post])]).slice(0,7).map(x=>`<li>${x}</li>`).join('')}</ul><div class="hint">点击其他课程可切换分析中心；点击“清除高亮”返回全图。</div>`}
    function preview(id){if(!pinned&&hovered!==id){hovered=id;renderSheet(id);renderDetail(id)}}
    function bindCourses(){document.querySelectorAll('.course').forEach(el=>{el.addEventListener('mouseenter',()=>preview(el.dataset.id));el.addEventListener('focus',()=>preview(el.dataset.id));el.addEventListener('click',()=>{pinned=pinned===el.dataset.id?null:el.dataset.id;hovered=null;renderSheet();renderDetail(pinned)})})}
    document.querySelector('#sheet').addEventListener('mouseleave',()=>{if(!pinned&&hovered){hovered=null;renderSheet();renderDetail(null)}});
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentView=t.dataset.view;pinned=null;hovered=null;document.querySelector('#view-title').textContent=views[currentView].title;renderSheet();renderDetail(null)}));document.querySelector('#reset').addEventListener('click',()=>{pinned=null;hovered=null;renderSheet();renderDetail(null)});
    renderSheet();renderDetail(null);
  </script>
</body>
</html>
